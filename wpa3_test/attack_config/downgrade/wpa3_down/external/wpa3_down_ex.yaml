name: wpa3_transition_downgrade_external
attacker_module: wpa3_trans_downgrade
$extends: [
  ../../../comp/rogue_ap/rogue_ap_6.comp.yaml,
]
actors:
  ap:
    source: internal
    selection:
      condition: [ AP, 2_4GHz ]
      permanent_mac: "90:de:80:6c:90:92"
    setup:
      program: hostapd
      program_config:
        version: 2_11
        driver: nl80211
        ssid: test_wpa3_tester
        hw_mode: g
        channel: 6
        ieee80211n: 1
        ieee80211w: 2
        wpa: 2
        wpa_key_mgmt: SAE
        rsn_pairwise: CCMP
        sae_password: password123
    ip_addr: "172.16.100.1"
  client:
    source: external
    scan_ignore: yes
    selection:
      condition: [ STA, 2_4GHz ]
      channel: 6
  attacker:
    source: internal
    selection:
      permanent_mac: "24:ec:99:bf:b0:a1"
      condition: [ monitor, 2_4GHz ]
      channel: 6
  rogue_ap:
    selection:
      permanent_mac: "24:ec:99:bf:c7:cf"
observers:
  attacker_tshark:
    actor: attacker
    program: tshark
    program_config:
      filter: "special_filter:actors"
attack_config:
  wait_after_stop: 60

rewrite: errors
