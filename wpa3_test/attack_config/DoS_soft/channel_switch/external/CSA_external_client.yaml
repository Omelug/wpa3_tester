$schema: https://json-schema.org/draft/2020-12/schema
name: CSA_external_client
attacker_module: channel_switch
$validator: ../channel_switch.schema.yaml
scan_iface: wlan1
actors:
  access_point:
    source: internal
    selection:
      condition: [ AP, 2_4GHz ]
      channel: 6
      permanent_mac: "24:ec:99:bf:c7:cf"
      driver: ath9k_htc
    setup:
      program: hostapd
      program_config:
        version: 2_11
        country_code: CZ
        driver: nl80211
        ssid: test_channel_switch
        hw_mode: g
        auth_algs: 1
        wpa: 2
        ieee80211n: 1
        ieee80211w: 2
        wpa_key_mgmt: SAE
        rsn_pairwise: CCMP
        wpa_passphrase: password123
        sae_password: password123
        channel: 6
    ip_addr: "10.0.0.1"
  client:
    source: external
    selection:
      condition: [ STA, 2_4GHz ]
      channel: 6
  attacker:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz ]
      channel: 6
$extends: [ ./ex_observers.comp.yaml, ../rogue_ap.comp.yaml ]

attack_config:
  attack_time: 60
  ms_interval: 100
  new_channel: 1
  sleep_before_sec: 10
  sleep_after_sec: 10
install_req: true
rewrite: errors
