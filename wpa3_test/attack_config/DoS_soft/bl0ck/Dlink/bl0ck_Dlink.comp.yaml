attacker_module: bl0ck
scan_iface: wlan1
actors:
  ap:
    $extends: ../../../comp/Dlink/Dlink_wb_5Ghz.comp.yaml
    setup:
      ex_WB_programs: [ tcpdump, iperf3 ]
  client:
    source: internal
    setup:
      program: wpa_supplicant
      program_config:
        other_options: "-d"
        #freq_list: 5180
        group: CCMP
        ieee80211w: 2
        key_mgmt: SAE
        pairwise: CCMP
        sae_password: password123
        scan_freq: 5180
        ssid: test_wpa3_tester_5GHz
        version: 2_10
    selection:
      #permanent_mac: "00:c0:ca:b7:69:2a"
      condition: [ monitor, control_monitor,
                   80211ac, 5GHz, netns_change ]
    netns: sta
    ip_addr: "172.16.100.2"
    sniff_iface: true
  attacker:
    source: internal
    selection:
      channel: 36
      #driver: rtw_8821cu #TODO rtw_8821au nefunguje, proč?
      condition: [
        monitor,
        5GHz,
        control_monitor
      ]
observers:
  #NOT ONLy for view, important for bl0ck  QoS generation
  mausezahn: #FIXME only one direction traffic
    actor: client
    program: mausezahn
    program_config:
      target_actor: ap
  ap_mausezahn:
    actor: client
    program: iperf3
    program_config:
      target_actor: ap
  att_tshark:
    actor: attacker
    program: tshark
    program_config:
      filter: "special_filter:actors"
  client_tshark:
    actor: client
    program: tshark
    program_config:
      filter: "special_filter:actors"
  tracer:
    program: trace_cmd
    actor: ap
    program_config:
      events: [ "mac80211", "mt76" ]
  dmesg:
    program: dmesg
attack_config:
  attack_time_sec: 30
  random: false
  frame_in_batch: 50
  ms_interval: 10