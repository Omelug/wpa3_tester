$schema: https://json-schema.org/draft/2020-12/schema
name: malformed_eapol1
$validator: ./malformed_eapol1.schema.yaml
attacker_module: malformed_eapol1

$extends: [
  ../../comp/ap/ap_2_11_WPA3_only_MFPr_6.comp.yaml,
  # 2_10 not patched
  ../../comp/client/client_2_10_WPA3_only_MFPr_6.comp.yaml
]

actors:
  ap:
    setup:
      program_config:
        other_options: "-d"
  attacker:
    source: internal
    selection:
      driver: mt76x2u
      condition: [ monitor, 2_4GHz ]
      channel: 6
observers:
  mz_gen:
    actor: client
    program: mausezahn
    program_config:
      target_actor: ap
  client_tshark:
    actor: client
    program: tshark
    program_config:
      filter: "special_filter:actors"
  ap_tshark:
    actor: ap
    program: tshark
    program_config:
      filter: "special_filter:actors"
attack_config:
  attack_time: 30
  ms_interval: 10
  sleep_before_sec: 5
  sleep_after_sec: 7