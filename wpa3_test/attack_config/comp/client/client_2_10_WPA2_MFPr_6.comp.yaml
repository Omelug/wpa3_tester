actors:
  client:
    source: internal
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_10
        ssid: test_wpa3_tester
        psk: password123 # TODO tohle zapsat do dokuemntace, pokud je sae_password, je klient imuní (zjistit jak se to ukládá z network manager gui)
        ieee80211w: 2
        proto: RSN
        key_mgmt: WPA-PSK
        pairwise: CCMP
        group: CCMP
    selection:
      channel: 6
      condition: [ managed, 2_4GHz, netns_change]
    netns: sta
    ip_addr: "172.16.100.2"