$schema: https://json-schema.org/draft/2020-12/schema
name: invalid_curve_attack_dragonslayer
attacker_module: invalid_curve
actors:
  ap:
    source: internal
    selection:
      channel: 6
      condition: [ AP, 2_4GHz ]
    setup:
      program: hostapd
      program_config:
        version: 2_7
        hostapd_path: "./config/hostapd.conf"
    ip_addr: "172.16.100.1"
  client:
    source: internal
    selection:
      condition: [ managed, 2_4GHz, netns_change ]
      channel: 6
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_10
        wpa_supplicant_path: "./config/valid_client.conf"
    netns: sta
    ip_addr: "172.16.100.2"
  attacker:
    source: internal
    selection:
      driver: mt76x2u
      condition: [ monitor, 2_4GHz ]
      channel: 6
attack_config:
  $validator: ../dragonslayer.schema.yaml
  target_type: ap
