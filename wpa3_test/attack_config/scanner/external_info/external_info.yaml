$schema: https://json-schema.org/draft/2020-12/schema
name: external_info
$validator: "./external_info.schema.yaml"
attacker_module: external_info

actors:
  scanner:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz ]
      channel: 6
    #sniff_iface: scanner //TODO sniff_iface testy -
    # FIXME rtl8xxxu nefunguje (dá se na channel 6 , monito ale nic nevypisuje)

observers:
  tshark_scanner:
    actor: scanner
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config:
  timeout_sec: 30
  # actor_limit: 10   # stop after discovering this many APs (0 or omit = unlimited)

rewrite: all