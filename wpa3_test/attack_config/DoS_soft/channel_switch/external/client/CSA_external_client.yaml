$schema: https://json-schema.org/draft/2020-12/schema
name: CSA_external_client
attacker_module: channel_switch
$validator: ../../channel_switch.schema.yaml
scan_iface: wlan1


$extends: [
  ../../../../comp/ap/ap_2_11_WPA3_only_MFPr_6.comp.yaml,
  ../../../../comp/rogue_ap/rogue_ap_1.comp.yaml,
  ../ex_observers.comp.yaml,
]

actors:
  ap:
    source: internal
    selection:
      permanent_mac: "24:ec:99:bf:c7:cf"
      driver: ath9k_htc
    setup:
      program_config:
        other_options: "-d"
        country_code: CZ
        # s ieee80211w: 1 OnePlus funguje (i když je to nevalidní podle WPA3, nejspíš to není vyjímečné - dohledat zdroj)
        #ieee80211w: 1
        #wpa_key_mgmt: SAE WPA-PSK
  client:
    source: external
    scan_ignore: yes
    selection:
      condition: [ STA, 2_4GHz ]
      channel: 6
  attacker:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz ]
      channel: 6
  rogue_ap:
    selection:
      permanent_mac: 24:ec:99:bf:b0:a1

attack_config:
  attack_time: 60
  ms_interval: 100
  new_channel: 1
  sleep_before_sec: 10
  sleep_after_sec: 10

rewrite: errors
