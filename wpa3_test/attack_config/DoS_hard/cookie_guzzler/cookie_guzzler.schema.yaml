title: Cookie guzzler Config
$extends: ../dos_time.comp.schema.yaml
type: object
required:
  - actors
  - attack_config
properties:
  actors:
    required:
      - ap
      - client
      - attacker
  attack_config:
    type: object
    required:
      $UNION: [ burst_size, frames_per_second_limit, variant ]
    additionalProperties: false
    properties:
      burst_size:
        type: integer
        minimum: 1
      frames_per_second_limit:
        type: integer
        minimum: 1
      variant:
        type: string
        enum: [ muted_peer, hasty_peer ]
