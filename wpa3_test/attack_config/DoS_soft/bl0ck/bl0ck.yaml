$schema: https://json-schema.org/draft/2020-12/schema
name: bl0ck
attacker_module: bl0ck

requirements:
  two_iface:
    injection_more_fragments_spoofed: [attacker, client]
    injection_more_fragments_valid: [attacker, client]
    injection_fields_order_spoofed: [attacker, client]
    injection_fields_order_valid: [attacker, client]
  rssi_setup: [
    "(ap <-> attacker) > -90",
    "(ap <-> client) > -90",
    "(attacker <-> client) > (ap <-> client)"
  ]

actors:
  ap:
    source: internal
    selection:
      condition: [ AP, 80211ac, 5GHz ]
    setup:
      program: hostapd
      program_config:
        channel: 36
        driver: nl80211
        hw_mode: a
        ieee80211ac: 1
        ieee80211n: 1
        ieee80211w: 2
        rsn_pairwise: CCMP
        sae_password: password123
        ssid: wpa3_tester_AP
        version: 2_10
        vht_oper_chwidth: 0
        wpa: 2
        wpa_key_mgmt: SAE
    ip_addr: "172.16.100.1"
  client:
    source: internal
    setup:
      program: wpa_supplicant
      program_config:
        freq_list: 5180
        group: CCMP
        ieee80211w: 2
        key_mgmt: SAE
        pairwise: CCMP
        psk: password123
        #sae_password: password123
        scan_freq: 5180
        ssid: wpa3_tester_AP
        version: 2_10
    selection:
      condition: [ monitor, 80211ac, 5GHz ]
    netns: sta
    ip_addr: "172.16.100.2"
    sniff_iface: client_mon
  attacker:
    source: internal
    selection:
      channel: 36
      condition: [ #injection, #TODO má tu být injection?
        monitor,
        5GHz ]
      driver: [ rtw_8821cu, rtw88_8821cu, rtl8821cu ]
observers:
  ap_mausezahn:
    actor: ap
    program: mausezahn
    program_config:
      target_actor: client
  att_tshark:
    actor: attacker
    program: tshark
    program_config:
      filter: "special_filter:actors"
  client_tshark:
    actor: client
    program: tshark
    program_config:
      filter: "special_filter:actors"
attack_config:
  ms_interval: 100
  sleep_before_sec: 5
  sleep_after_sec: 5
rewrite: errors