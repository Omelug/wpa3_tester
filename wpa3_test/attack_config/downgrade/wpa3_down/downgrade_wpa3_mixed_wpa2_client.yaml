name: wpa3_transition_downgrade_mixed_wpa2_client
attacker_module: wpa3_trans_downgrade
$extends: [ ./downgrade_vuln.yaml ]
actors:
  ap:
    setup:
      program_config:
        ieee80211w: 2
        wpa_key_mgmt: SAE WPA-PSK
        wpa_passphrase: password123
  client:
    setup:
      program: wpa_supplicant
      program_config:
        key_mgmt: WPA-PSK
        ieee80211w: 1
attack_config:
  wait_after_stop: 60
