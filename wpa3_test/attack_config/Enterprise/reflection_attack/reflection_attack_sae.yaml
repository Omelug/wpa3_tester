    source: external
    selection:
      mac: "78:98:E8:55:3E:8D"
      channel: 6
    ip_addr: "172.16.100.1"
  client:
    source: internal
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_10
        ssid: OpenWrt_radio0
