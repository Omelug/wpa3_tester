name: reflection_attack
attacker_module: reflection_attack
requirements:
  two_iface:
    injection_fields_spoofed: [ attacker, ap ]
    injection_fields_valid: [ attacker, ap ]

actors:
  ap:
    source: internal
    selection:
      channel: 6
      condition: [ AP, 2_4GHz ]
    setup:
      program: hostapd
      program_config:
        version: 2_7
        other_options: "-d" #FIXME hostapd_path
        hostapd_path: "./config/hostapd.conf"
    ip_addr: "172.16.100.1"
  attacker:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz, netns_change ]
      channel: 6
    netns: att
observers:
  attacker_tshark:
    actor: attacker
    program: tshark
    program_config:
      #filter: ""
      filter: "special_filter:actors"
  ap_tshark:
    actor: ap
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config: # TODO validation
  identity: bob

rewrite: errors
delete_old: true