title: Cookie guzzler Config
$extends: ../dos_time.comp.schema.yaml
type: object
required:
  - actors
  - attack_config
properties:
  actors:
    required:
      - ap
      - client
      - attacker
  attack_config:
    type: object
    required:
      $UNION: [ burst_size ]
    additionalProperties: false
    properties:
      burst_size:
        type: integer
      frames_per_second_limit:
        type: integer
        default: 99999999999
