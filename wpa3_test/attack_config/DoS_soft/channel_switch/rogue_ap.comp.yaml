actors:
  rogue_ap:
    source: internal
    selection:
      channel: 1
      condition: [ AP, 2_4GHz ]
      driver: ath9k_htc
    setup:
      program: hostapd-mana
      program_config:
        #version: 2_6
        driver: nl80211
        ssid: test_channel_switch
        hw_mode: g
        channel: 1
        ieee80211n: 1
        ieee80211w: 1
        group_mgmt_cipher: AES-128-CMAC
        wpa_key_mgmt: WPA-PSK WPA-PSK-SHA256
        wpa: 2
        wpa_passphrase: wrong_password
        rsn_pairwise: CCMP
        wpa_pairwise: CCMP
        macaddr_acl: 0
        mana_loud: 1
        #mana_wpaout: 1
        #enable_mana: 1
        #mana_mode: 1
        #mana_wpaout: 1
        #mana_wpaout: "mana_handshakes.hccapx"
        #mana_wpaout: wpa.creds
        #mana_outfile: hostapd.manaout
        #mana_wpaout:wpa.creds