name: Clang-Tidy

on:
  push:
    branches: [main]

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy-18 python3-yaml

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Run clang-tidy
        run: |
          CHECKS=$(python3 -c "
          import yaml, sys
          for doc in yaml.safe_load_all(open('.clangd')):
              ct = (doc or {}).get('Diagnostics', {}).get('ClangTidy', {})
              if 'Checks' in ct:
                  print(','.join(ct['Checks']))
                  sys.exit(0)
          ")

          # every file git actually tracks in the whole repo
          # (this automatically excludes anything matched by .gitignore)
          mapfile -t FILES < <(git ls-files)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No tracked files found, nothing to check."
            exit 0
          fi

          # Turn the tracked file list into a regex alternation that
          # run-clang-tidy-18 matches (via re.search) against absolute paths
          # from the compilation database.
          FILTER=$(printf '%s\n' "${FILES[@]}" | python3 -c "
          import re, sys
          print('|'.join(re.escape(line.strip()) for line in sys.stdin if line.strip()))
          ")

          run-clang-tidy-18 -p build -checks="$CHECKS" -header-filter='.*' "$FILTER"