name: wpa3_transition_downgrade_wpa3_disable
attacker_module: wpa3_trans_downgrade
$extends: [ ./downgrade_vuln.yaml ]
actors:
  ap:
    selection:
      condition: [ AP, 2_4GHz ]
      channel: 6
    setup:
      program_config:
        hw_mode: g
        channel: 6
        other_options: -d
        transition_disable: "0x01"
        wpa_key_mgmt: SAE

  client:
    selection:
      condition: [ managed, 2_4GHz, netns_change ]
      channel: 6
    setup:
      program: wpa_supplicant
      program_config:
        other_options: -d
        ieee80211w: 1 #Needed for WPA3 disable ?
        key_mgmt: SAE WPA-PSK
        psk: password123 #needed for connect to transition (at least rtw89_8852au)
  attacker:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz ]
      channel: 6
  rogue_ap:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz ]
      channel: 6
attack_config:
  wait_after_stop: 60

