$schema: https://json-schema.org/draft/2020-12/schema
name: channel_switch_Dlink
attacker_module: channel_switch
$validator: ../../channel_switch.schema.yaml
$extends: [ ../../../../comp/client/client_2_10_WPA3_mixed_MFPo_6.comp.yaml,
            ../../observers.comp.yaml,
            ../../../../comp/rogue_ap/rogue_ap_1.comp.yaml ]
actors:
  ap:
    source: external
    selection:
      channel: 6
      whitebox_host: OpenWrt
      condition: [ AP, 2_4GHz ]
    setup:
      program: openwrt
      program_config:
        ssid: test_wpa3_tester
        channel: 6
        key: password123
        proto: RSN
        encryption: sae-mixed
        mode: ap
        htmode: HT20
        ieee80211w: 2
      ex_WB_programs: [ tcpdump ]
    ip_addr: "10.0.0.1"
  client:
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_11
  attacker:
    source: internal
    selection:
      driver: mt76x2u
      condition: [ monitor, 2_4GHz ]
      channel: 6
attack_config:
  attack_time: 60
  ms_interval: 100
  new_channel: 1
  sleep_before_sec: 10
  sleep_after_sec: 10
install_req: true
