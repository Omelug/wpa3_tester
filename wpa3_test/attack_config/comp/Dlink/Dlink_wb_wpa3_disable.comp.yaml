source: external
selection:
  whitebox_host: OpenWrt
  condition: [ AP, 2_4GHz ]
setup:
  program: openwrt
  program_config:
    version: 2_11
    ssid: OpenWrt_2_4GHz
    channel: 6
    key: password123
    proto: RSN
    encryption: sae-mixed
    mode: ap
    htmode: HT20
    transition_disable: "0x01"
  ex_WB_programs: [ tcpdump ]
ip_addr: "172.16.100.1"
