$schema: https://json-schema.org/draft/2020-12/schema
name: CSA_external_client_invalid_ch
attacker_module: channel_switch
actors:
  ap:
    source: internal
    selection:
      condition: [ AP, 2_4GHz ]
      channel: 6
  client:
    selection:
      condition: [ STA, 2_4GHz ]
  attacker:
    selection:
      condition: [ monitor, 2_4GHz ]
      channel: 6
  # check only disconnected

attack_config:
  attack_time: 60
  ms_interval: 100
  #14 is only allowed in Japan
  new_channel: 14
  sleep_before_sec: 10
  sleep_after_sec: 10

$extends: [./CSA_external_client.yaml]
