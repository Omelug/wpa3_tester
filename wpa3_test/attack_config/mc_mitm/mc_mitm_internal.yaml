name: mc_mitm_test_internal
attacker_module: mc_mitm

# TODO validator -> no SNIFF IFACES -> ap/MONITOR/MANGED ISSUES
requirements:
  rssi_setup:
    band: "2_4GHz"
    conditions: [
      "(ap <-> rogue_client) > -90",
      "(client <-> rogue_ap) > -90",
      "(client <-> ap) < (client <-> rogue_ap)",
      "(client <-> ap) < (ap <-> rogue_client)"
    ]
actors:
  ap:
    source: internal
    selection:
      channel: 11
      #permanent_mac: "24:ec:99:bf:b0:a1"
      condition: [ AP, 2_4GHz, netns_change ]
    setup:
      program: hostapd
      program_config:
        other_options: -d
        version: 2_11
        driver: nl80211
        ssid: test_mc_mitm
        hw_mode: g
        auth_algs: 1
        wpa: 2
        ieee80211n: 1
        ieee80211w: 2
        wpa_key_mgmt: SAE
        rsn_pairwise: CCMP
        wpa_passphrase: password123
        sae_password: password123
        channel: 11
    ip_addr: "172.16.100.1"
    netns: ap
  client:
    source: internal
    selection:
      condition: [ managed, 2_4GHz, netns_change ]
      #TODO driver: rtw_8821cu save BSSID in formware -> not reset on test start
      permanent_mac: "24:ec:99:bf:c7:cf"
      driver: ath9k_htc
      channel: 11
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_11
        other_options: -d #d
        group: CCMP
        ieee80211w: 2
        key_mgmt: SAE
        pairwise: CCMP
        proto: RSN
        sae_password: password123
        ssid: test_mc_mitm
    netns: sta
    ip_addr: "172.16.100.2"
  rogue_client:
    source: internal
    selection:
      permanent_mac: "90:de:80:6c:90:92"
      driver: mt76x2u #mt7921e
      condition: [ monitor, 2_4GHz, netns_change ] #active_monitor
      channel: 11
    netns: r_sta
  rogue_ap:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz ]
      permanent_mac: "90:de:80:de:fd:b2"
      driver: mt76x2u #FIXME mt7921e ?
      channel: 1
observers: #(allow start_observers if used )
  #client_mausezahn:
  #  actor: client
  #  program: mausezahn
  #  program_config:
  #    target_actor: ap

  #client_tshark:
  #  actor: client
  #  program: tshark
  #  program_config:
  #    filter: ""

  tester_dmesg:
    program: dmesg
    #program_config:
    #  level: "err,warn"
  tracer:
    program: trace_cmd
    actor: ap
    program_config:
      events: [ "mac80211", "mt76", "ath" ]

  channel1_tshark:
    actor: rogue_ap
    program: tshark
    program_config:
      filter: "special_filter:actors"

  channel6_tshark:
    actor: rogue_client
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config:
  attack_time: 50
  only_to_mitm: true
  ssid: test_mc_mitm

rewrite: errors