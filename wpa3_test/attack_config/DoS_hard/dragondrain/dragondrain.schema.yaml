title: Config for dragondrain wrapper
type: object
properties:
  attack_config:
    type: object
    additionalProperties: false
    properties:
      sleep_before_sec:
        type: integer
        default: 5
      sleep_after_sec:
        type: integer
        default: 5
      bitrate:
        type: integer
        default: 54
      number_of_random_mac:
        type: integer
        description: number of generated mac addresses what are used for attack
        default: 1
      timeout_sec:
        type: integer
        description: attack time (dragondrain)
        default: 30
      r:
        type: integer
        default: 200
      interval:
        type: integer
      #g:
      #  type: integer
      #  description: group, only P-521, has to be checked
      #  enum: [21, ]

