$schema: https://json-schema.org/draft/2020-12/schema
name: mc_mitm_test_internal
attacker_module: mc_mitm

# TODO validator -> no SNIFF IFACES -> ap/MONITOR/MANGED ISSUES
actors:
  ap:
    source: internal
    selection:
      channel: 11
      condition: [ AP, 2_4GHz ]
    setup:
      program: hostapd
      program_config:
        driver: nl80211
        ssid: test_mc_mitm
        hw_mode: g
        auth_algs: 1
        wpa: 2
        ieee80211n: 1
        ieee80211w: 2
        wpa_key_mgmt: SAE
        rsn_pairwise: CCMP
        wpa_passphrase: password123
        sae_password: password123
        channel: 11
    ip_addr: "172.16.100.1"

  client:
    source: internal
    selection:
      condition: [ managed, 2_4GHz, netns_change]
      #TODO driver: rtw_8821cu save BSSID in formware -> not reset on test start
      driver: ath9k_htc
      channel: 11
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_10
        other_options: -d #d
        group: CCMP
        ieee80211w: 2
        key_mgmt: SAE
        pairwise: CCMP
        proto: RSN
        sae_password: password123
        ssid: test_mc_mitm
    netns: sta
    ip_addr: "172.16.100.2"

  rogue_client:
    source: internal
    selection:
      #permanent_mac: "00:c0:ca:b7:69:2a" #FIXME I cant change channel on second mt76 adapter
      driver: mt76x2u #mt7921e
      condition: [ monitor, 2_4GHz ] #active_monitor
      channel: 11
  rogue_ap:
    source: internal
    selection:
      condition: [ managed, 2_4GHz]
      driver: mt76x2u #FIXME mt7921e ?
      channel: 1
observers: #(allow start_observers if used )
  #client_mausezahn:
  #  actor: client
  #  program: mausezahn
  #  program_config:
  #    target_actor: ap

  #client_tshark:
  #  actor: client
  #  program: tshark
  #  program_config:
  #    filter: ""

  channel1_tshark:
    actor: rogue_ap
    program: tshark
    program_config:
      filter: "special_filter:actors"

  channel6_tshark:
    actor: rogue_client
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config:
  attack_time: 50
  only_to_mitm: true
  ssid: test_mc_mitm

rewrite: errors