observers:
  client_mausezahn:
    actor: client
    program: mausezahn
    program_config:
      target_actor: ap
  ap_tshark:
    actor: client
    program: tshark
    program_config:
      filter: "udp port 5201"
  ap_tcpdump:
    actor: ap
    program: tcpdump
    program_config:
      filter: "udp port 5201"
  attacker_tshark:
    actor: attacker
    program: tshark
    program_config:
      filter: "special_filter:actors"
