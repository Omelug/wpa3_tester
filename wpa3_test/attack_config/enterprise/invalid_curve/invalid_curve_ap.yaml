name: invalid_curve_attack
attacker_module: invalid_curve
requirements:
  two_iface:
    injection_fields_spoofed: [ attacker, ap ]
    injection_fields_valid: [ attacker, ap ]

actors:
  ap:
    source: internal
    selection:
      channel: 6
      condition: [ AP, 2_4GHz, netns_change ]
    setup:
      program: hostapd
      program_config:
        version: 2_7
        other_options: "-d"
        hostapd_path: "./config/hostapd.conf"
    ip_addr: "172.16.100.1"
    netns: ap
  attacker:
    source: internal
    selection:
      #driver: ath9k_htc
      condition: [ monitor, 2_4GHz ]
      channel: 6
observers:
  attacker_tshark:
    actor: attacker
    program: tshark
    program_config:
      filter: "special_filter:actors"
  ap_tshark:
    actor: ap
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config:
  identity: "bob"
  attack_time_one_try_sec: 30
  replay: 5

rewrite: errors
save_log: true
