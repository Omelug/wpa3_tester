$schema: https://json-schema.org/draft/2020-12/schema
title: Test Configuration Schema
type: object
required:
  - name
  - attacker_module
  - actors
properties:
  config_type:
    type: string
    const: test
    description: "Have to be test or not included"
  $extends:
    type: string
    description: Path to the parent YAML template
  name:
    type: string
    description: Test name
    pattern: '^[^\x00/]+$'
    not:
      const: test_config
      description: reserved name

  attacker_module:
    type: string
    description: Name of attacker_module

  actors:
    type: object
    description: Test actors definitions
    minProperties: 1
    additionalProperties:
      $ref: '#/$defs/Actor'
  observers:
    type: object
    description: Test observer definitions
    additionalProperties:
      $ref: '#/$defs/Observer'
  scan_iface:
    type: string
    description: Interface to scan when source is external
  #TODO validate that scan_iface is required when any actor has source: external
  #  if:
  #    properties:
  #      actors:
  #        type: object
  #        additionalProperties:
  #          properties:
  #            source:
  #              enum: [ external ]
  #          required: [ source ]
  #          not:
  #            anyOf:
  #              - required: [ whitebox_ip ]
  #              - required: [ whitebox_host ]
  #    required: [ actors ]
  #  then:
  #    required: [ scan_iface ]

  attack_config:
    type: object
    description: test/attack parameters
    properties:
      $validator:
        type: string
        description: validator
  requirements:
    type: object
    description: Hardware/interface requirements for this actor
    properties:
      simple:
        type: array
        items:
          type: string
          enum:
            - ath_masker
            - ath9k_noorder_change
      rssi_setup:
        type: array
        items:
          type: string
        description: "should be parsable parts of rssi_condition.cpp parser (there are connected with && in code, dont need write it)"
      two_iface:
        type: object
        description: Two-interface requirement
        properties:
          active:
            type: array
            items:
              type: string
            minItems: 2
            description: two_iface
          injection:
            type: array
            items:
              type: string
            minItems: 2
            description: two_iface all injection test
          injection_more_fragments_spoofed:
            type: array
            items:
              type: string
            minItems: 2
          injection_more_fragments_valid:
            type: array
            items:
              type: string
            minItems: 2
          injection_fields_spoofed:
            type: array
            items:
              type: string
            minItems: 2
          injection_fields_valid:
            type: array
            items:
              type: string
            minItems: 2
          injection_fields_order_spoofed:
            type: array
            items:
              type: string
            minItems: 2
          injection_fields_order_valid:
            type: array
            items:
              type: string
            minItems: 2
          #TODO not done in code
          injection_fields_retrans:
            type: array
            items:
              type: string
            minItems: 2
          test_injection_txack:
            type: array
            items:
              type: string
            minItems: 2
            #TODO simplify this
        additionalProperties: false
      ex_BB_connection:
        type: array
        description: List of expected STA-AP connections; each pair is [sta_actor_name, ap_actor_name] (both must be external actors)
        items:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
    additionalProperties: false

allOf:
  - $ref: './run_config.schema.yaml'

$defs:
  Actor:
    type: object
    additionalProperties: false
    required:
      - source
    properties:
      source:
        type: string
        enum: [ "simulation","internal", "external" ]
        description: mac_hwsim, internal, external
      netns:
        type: string
        description: Namespace to isolate AP/STA for iperf3 etc. observation
      ip_addr:
        type: string
        # Regex pro IPv4 (0.0.0.0 až 255.255.255.255)
        pattern: '^((25[0-5]|(2[0-4]|1\d|[1-9]|)\d)\.?\b){4}$'
        description: Static IP address for the actor (e.g., 192.168.1.1)
      setup:
        type: object
        additionalProperties: false
        properties:
          program:
            type: string
            enum: [ "hostapd", "wpa_supplicant", "openwrt", "hostapd-mana" ]
          program_config:
            type: object
            description: Configuration for the program (hostapd.conf, wpa_supplicant.conf, etc.)
          ex_WB_programs:
            type: array
            items:
              type: string
            description: Program names what has to be installed (on external)
        allOf:
          - if:
              properties:
                program:
                  const: openwrt
            then:
              properties:
                program_config:
                  $ref: './programs/actor/openwrt.yaml'
          - if:
              properties:
                program:
                  const: hostapd
            then:
              properties:
                program_config:
                  $ref: './programs/actor/hostapd.yaml'
          - if:
              properties:
                program:
                  const: hostapd-mana
            then:
              properties:
                program_config:
                  $ref: './programs/actor/hostapd-mana.yaml'
          - if:
              properties:
                program:
                  const: wpa_supplicant
            then:
              properties:
                program_config:
                  $ref: './programs/actor/wpa_supplicant.yaml'
      selection:
        type: object
        additionalProperties: false
        properties:
          whitebox_ip:
            type: string
          whitebox_host:
            type: string
            description: hostname
          channel:
            type: integer
          ht_mode:
            type: string
            enum:
              - ""        # Legacy (without HT)
              - "NOHT"    # turn off HT
              - "HT20"    # 20MHz (same as for VHT20 )
              - "HT40-"   # 40MHz Lower
              - "HT40+"   # 40MHz Upper
              - "80MHz"   # VHT 80MHz
              - "160MHz"  # VHT/HE 160MHz
              - "320MHz"  # EHT (Wi-Fi 7)
          mac:
            type: string
            pattern: '^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$'
            description: MAC address in format AA:BB:CC:DD:EE:FF
          permanent_mac:
            type: string
            pattern: '^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$'
            description: Permanent (hardware) MAC address in format AA:BB:CC:DD:EE:FF
          essid:
            type: string
            description: Name of AP
          ssid:
            type: string
            description: SSID of the AP (external source only)
          iface:
            type: string
            description: Name of interface
          driver:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
                minItems: 1
            description: driver of wifi card, or list of accepted drivers
          driver_hash:
            type: string
            description: srcversion or sha256 hash of the driver module
          module_hash:
            type: string
            description: combined sha256 of driver + all depend modules srcversions
          condition:
            type: array
            items:
              type: string
              enum: [ "AP", "STA", "injection_selftest", "managed", "monitor", "control_monitor", "active_monitor", "2_4GHz", "5GHz", "6GHz", "WPA-PSK", "WPA3-SAE", "80211n", "80211ac", "80211ax", "beacon_prot", "CSA", "OCV", "MFP" ]
            minItems: 1
            description: Condition for selection
        minProperties: 1
      scan_ignore:
        type: boolean
        description: Exclude this actor from BB scanning (MAC resolved at runtime, e.g. via AP-STA-CONNECTED)
      sniff_iface:
        type: string
        description: Name of interface for monitoring (will create like associated on iface in selection)
    # Validation rules
    allOf:
      # netns can only be used with source: internal
      - if:
          required: [ netns ]
        then:
          properties:
            source:
              type: string
              enum:
                - internal
                - simulation
          required: [ source ]
          errorMessage: "netns can only be used with source: internal"
      # ex_WB_programs only allowed for source: external
      - if:
          not:
            properties:
              source:
                const: external
            required: [ source ]
        then:
          properties:
            setup:
              properties:
                ex_WB_programs:
                  not: { }
          errorMessage: "ex_WB_programs can only be used with source: external"
      # whitebox_ip/whitebox_host not allowed if not external
      - if:
          not:
            properties:
              source:
                const: external
            required: [ source ]
        then:
          not:
            anyOf:
              - required: [ whitebox_ip ]
              - required: [ whitebox_host ]
              - required: [ external_OS ]
          errorMessage: "whitebox_ip/whitebox_host not allowed if not external"
      # ssid in selection only allowed for source: external
      - if:
          not:
            properties:
              source:
                const: external
            required: [ source ]
        then:
          properties:
            selection:
              not:
                required: [ ssid ]
          errorMessage: "ssid in selection can only be used with source: external"
      - if:
          properties:
            setup:
              properties:
                program:
                  const: openwrt
              required: [ program ]
          required: [ setup ]
        then:
          properties:
            source:
              const: external
          required: [ source ]
          errorMessage: "openwrt program can only be used with source: external"
      # at most one of AP / managed / monitor in condition
      - properties:
          selection:
            not:
              anyOf:
                - allOf:
                    - required: [ condition ]
                    - properties: { condition: { contains: { const: "AP" } } }
                    - properties: { condition: { contains: { const: "managed" } } }
                - allOf:
                    - required: [ condition ]
                    - properties: { condition: { contains: { const: "AP" } } }
                    - properties: { condition: { contains: { const: "monitor" } } }
                - allOf:
                    - required: [ condition ]
                    - properties: { condition: { contains: { const: "managed" } } }
                    - properties: { condition: { contains: { const: "monitor" } } }
        errorMessage: "condition can contain at most one interface mode: AP, managed, monitor"
      # exactly one of 2_4GHz / 5GHz / 6GHz in condition
      - properties:
          selection:
            not:
              anyOf:
                - allOf:
                    - required: [ condition ]
                    - properties: { condition: { contains: { const: "2_4GHz" } } }
                    - properties: { condition: { contains: { const: "5GHz" } } }
                - allOf:
                    - required: [ condition ]
                    - properties: { condition: { contains: { const: "2_4GHz" } } }
                    - properties: { condition: { contains: { const: "6GHz" } } }
                - allOf:
                    - required: [ condition ]
                    - properties: { condition: { contains: { const: "5GHz" } } }
                    - properties: { condition: { contains: { const: "6GHz" } } }
        errorMessage: "condition can contain at most one band: 2_4GHz, 5GHz, 6GHz"
      # when channel AND condition are both set, condition must contain exactly one band
      - if:
          properties:
            selection:
              required: [ channel, condition ]
          required: [ selection ]
        then:
          properties:
            selection:
              properties:
                condition:
                  anyOf:
                    - contains: { const: "2_4GHz" }
                    - contains: { const: "5GHz" }
                    - contains: { const: "6GHz" }
          errorMessage: "when channel is set, condition must contain exactly one band: 2_4GHz, 5GHz, 6GHz"
      # channel in selection requires a monitor-capable or AP condition (mirrors monitor_needed()) - not for external (channel is a selection criterion there)
      - if:
          properties:
            selection:
              required: [ channel, condition ]
            source:
              not:
                const: external
          required: [ selection ]
        then:
          properties:
            selection:
              properties:
                condition:
                  anyOf:
                    - contains: { const: "monitor" }
                    - contains: { const: "active_monitor" }
                    - contains: { const: "control_monitor" }
                    - contains: { const: "injection_selftest" }
                    - contains: { const: "AP" }
                    - contains: { const: "managed" }
          errorMessage: "when channel is in selection, condition must contain monitor, active_monitor, control_monitor, injection, managed or AP"
  Observer:
    type: object
    additionalProperties: false
    required:
      - actor
      - program
      - program_config
    properties:
      actor:
        type: string
        description: Actor to observe
      program:
        type: string
        enum: [ "mausezahn", "tcpdump", "tshark", "resource_checker", "station_counter" ]
        description: Program to use for observation
      program_config:
        type: object
    allOf:
      - if:
          properties:
            program:
              const: mausezahn
        then:
          properties:
            program_config:
              $ref: './programs/observer/mausezahn.yaml'
      - if:
          properties:
            program:
              const: tcpdump
        then:
          properties:
            program_config:
              $ref: './programs/observer/tcpdump.yaml'
      - if:
          properties:
            program:
              const: tshark
        then:
          properties:
            program_config:
              $ref: './programs/observer/tshark.yaml'
      - if:
          properties:
            program:
              const: resource_checker
        then:
          properties:
            program_config:
              $ref: './programs/observer/resource_checker.yaml'
      - if:
          properties:
            program:
              const: station_counter
        then:
          properties:
            program_config:
              $ref: './programs/observer/station_counter.yaml'
