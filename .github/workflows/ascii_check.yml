name: ASCII & blank-line check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ! git ls-files -z -- '*.c' '*.h' '*.cc' '*.cpp' '*.cxx' '*.hpp' '*.hxx' '*.hh' '*.inl' '*.cmake' \
            | xargs -0 --no-run-if-empty grep -InP --color=always '[^\x00-\x7F]|^[ \t]*[\r\v\f][ \t\r\v\f]*$'
