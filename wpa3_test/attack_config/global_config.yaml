# THIS IS ONLY EXAMPLE

$validator: ./validator/global_config.schema.yaml

# after usb restart (some drivers set to world or default domain)
# for persistent check REGDOMAIN in tester_setup/raspberry_pi4/image/customize.sh
regulatory_domain: CZ
internet_interface: wlan0 #check if names are same, this is internet iface for me
timeout_external_bb_scan_sec: 5

actors:
  conn_table: ./example_whitebox_table.csv
  ignore_interfaces: [ wlan0, eth0 ]
  nm_exclude_actors: false

paths:
  # These config keys are not included in result config,
  hostapd:
    # in this folder will be folder with cloned repository and binaries
    # (create empty folder if not sure, it will be build automatically)
    hostapd_build_folder: ../../tools/hostapd
    hostapd_mana_build_folder: ../../tools/hostapd_mana
  openssl:
    # vulnerable OpenSSL builds for hostapd (e.g. OpenSSL_1_0_2f)
    openssl_vuln_build_folder: ../../tools/openssl_vuln
  dragonslayer:
    # dragonslayer folder (!dragonslayer has subfolder dragonslayer)
    dragonslayer_folder: ../../tools/dragonslayer
  dragondrain:
    dragondrain_folder: ../../tools/dragondrain-and-time
  ath_masker: ../../tools/ath_masker
  WPA3_SAE_DoS_Research_Suite: ../../tools/WPA3-SAE-DoS-Research-Suite
only_list_reset:
  - "0e8d:7612" # MediaTek MT7612U
  - "0cf3:9271" # ath9k_htc USB adapter
  - "0bda:8179" # rtl8xxxu
  - "0bda:8832" # Realtek Semiconductor Corp. 802.11ac WLAN Adapter
  - "0bda:c811" # Realtek Semiconductor Corp. 802.11ac NIC
  - "0bda:0811" # Realtek Semiconductor Corp. Realtek 8812AU/8821AU 802.11ac WLAN Adapter [USB Wireless Dual-Band Adapter 2.4/5Ghz
  - "0586:341f" # ZyXEL Communications Corp. NWD2205 802.11n Wireless N Adapter [Realtek RTL8192CU]

#default yaml variables
#NOTE: these settings are not visible after -> are directly saved to test config
#NOTE: some tools use this values (should be editable, only for fallback with WARNING log)
# (ex.  channel: var_default_channel_5  # -> 36 (int))
global_variables:
  default_channel_2_4: 6
  default_channel_5: 36
  default_password: password123

#caches
use_hw_cache: false
use_two_iface_cache: true

#overwrite run_config
#delete_old: true
install_req: true
compile_external: true