actors:
  ap:
    source: internal
    setup:
      program_config:
        other_options: "-d"
    selection:
      permanent_mac: "24:ec:99:bf:c7:cf"
      driver: ath9k_htc
  client:
    setup:
      program_config:
        other_options: "-d"
    #selection
      #driver: rtw_8821au
  attacker:
    source: internal
    selection:
      channel: 6
      condition: [ monitor, 2_4GHz ]
      driver: mt76x2u
  #rogue_ap:
  # sniff_iface: r_ap

attack_config:
  attack_time: 30
  ms_interval: 100
  new_channel: 1
  sleep_before_sec: 10
  sleep_after_sec: 10
#only_stats: true
delete_old: false
rewrite: all
