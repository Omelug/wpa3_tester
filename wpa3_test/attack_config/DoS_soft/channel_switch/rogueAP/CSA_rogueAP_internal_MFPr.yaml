$schema: https://json-schema.org/draft/2020-12/schema
name: channel_switch_rogueAP_internal_MFPr
attacker_module: channel_switch
$validator: ../channel_switch.schema.yaml

$extends: [
  ../../../comp/ap/ap_2_11_WPA3_only_MFPr_6.comp.yaml,
  ../../../comp/client/client_2_10_WPA3_mixed_MFPr_6.comp.yaml,
