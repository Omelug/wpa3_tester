name: sae_dos_wrapper
attacker_module: sae_dos_wrapper
requirements:
  simple: [ ath_masker ]
actors:
  ap:
    $extends: ../../comp/Dlink/Dlink_wb.comp.yaml
  client:
    source: internal
    selection:
      condition: [ 2_4GHz, netns_change ]
      driver: [ mt76x2u, mt76x2u_git ]
    setup:
      program: wpa_supplicant
      program_config:
        ssid: test_wpa3_tester
        sae_password: password123
        ieee80211w: 2
        proto: RSN
        key_mgmt: SAE
        pairwise: CCMP
        group: CCMP
    netns: sta
    ip_addr: "172.16.100.2"
    sniff_iface: true
  attacker:
    source: internal
    selection:
      driver: ath9k_htc
      condition: [ monitor, 2_4GHz ] #injection_selftest
      channel: 6
    sniff_iface: true
observers:
  tshark_attacker:
    actor: attacker
    program: tshark
    program_config:
      filter: ""
  ap_resources:
    actor: ap
    program: resource_checker
    program_config:
      interval: 1
attack_config:
  attack_time_sec: 120
  # Which band the attacker adapter is on
  adapter_band: "2.4GHz"
  # Attack from orchestator_master_en.py ADAPTER_KONFIGURATION angriff field
  attack_type: "case12_bursty_auth"
  channel_5ghz: "104"
  frames_per_second_limit: 1000
  burst_size_optimal: 64
  inter_packet_gap: 0.0001
  max_restarts: 100
