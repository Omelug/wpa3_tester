name: double_decker_Dlink
attacker_module: double_decker
$validator: double_decker.schema.yaml
requirements:
  simple: [ ath_masker ]
actors:
  ap:
    $extends: ../../comp/Dlink/Dlink_wb.comp.yaml
    setup:
      program_config:
        sae_groups: "19 20 21"
  client:
    $extends: ../../comp/Dlink/mixed_client_2_4.comp.yaml
    setup:
      program_config:
        version: 2_11
        ssid: test_wpa3_tester_Dlink
        sae_password: password123
    selection:
      driver: [ mt76x2u, mt76x2u_git ]
    sniff_iface: true
  attacker:
    source: internal
    selection:
      driver: ath9k_htc
      condition: [ monitor, 2_4GHz ]
      channel: 6
    sniff_iface: true
$extends: [ ../observers_DoS.comp.yaml ]
observers:
  ap_stations:
    actor: ap
    program: station_counter
    program_config:
      interval: 1
attack_config:
  attack_time_sec: 300
  acm_threshold: 20
  acm_trigger_count: 10000
  acm_pause_millisec: 50
  burst_size: 32
  frames_per_second_limit: 1000
  cookie_wait_ms: 50
  use_connected_stas: true
  refresh_pre_acm_interval_sec: 60
rewrite: errors
