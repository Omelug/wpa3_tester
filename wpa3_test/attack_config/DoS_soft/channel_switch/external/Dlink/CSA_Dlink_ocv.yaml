name: channel_switch_Dlink_ocv
attacker_module: channel_switch
$validator: ../../channel_switch.schema.yaml
$extends: [ ../../observers.comp.yaml, ../../../../comp/rogue_ap/rogue_ap_1.comp.yaml ]
actors:
  ap:
    $extends: ../../../../comp/Dlink/Dlink_wb.comp.yaml
    selection:
      condition:
        $UNION: [ OCV ] # Dlink dont support OCV (checked both 2_4/5Ghz )
  client:
    source: internal
    selection:
      channel: 6
      condition: [ managed, 2_4GHz, netns_change ]
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_11
        ssid: test_wpa3_tester_Dlink
        #sae_password: password123
        psk: password123
        ieee80211w: 1
        proto: RSN
        key_mgmt: SAE WPA-PSK
        pairwise: CCMP
        group: CCMP
    netns: sta
    ip_addr: "172.16.100.2"
  attacker:
    source: internal
    selection:
      driver: [ mt76x2u, mt76x2u_git ]
      condition: [ monitor, 2_4GHz ]
      channel: 6
attack_config:
  attack_time: 60
  ms_interval: 100
  new_channel: 1
  sleep_before_sec: 10
  sleep_after_sec: 10

