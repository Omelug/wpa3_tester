$schema: https://json-schema.org/draft/2020-12/schema
name: channel_switch_test
attacker_module: channel_switch
$validator: ./channel_switch.schema.yaml
$extends: ./observers.comp.yaml
actors:
  ap:
    source: internal
    selection:
      condition: [ AP,  2_4GHz]
    setup:
      program: hostapd
      program_config:
        version: "2.11"
        hostapd_path: "./config/hostapd.conf"
    ip_addr: "10.0.0.1"
  client:
    source: internal
    setup:
      program: wpa_supplicant
      program_config:
        version: "2.9"
        wpa_supplicant_path: "./config/client.conf"
    netns: sta
    ip_addr: "10.0.0.2"
  attacker:
    source: internal
    selection:
      driver: mt76x2u
      condition: [ monitor, 2_4GHz ]
      channel: 6
attack_config:
  #TODO try same channel like current
  attack_time: 30
  ms_interval: 100
  new_channel: 1
  sleep_before_sec: 10
  sleep_after_sec: 10
rewrite: errors