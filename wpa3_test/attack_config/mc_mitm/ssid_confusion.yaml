$schema: https://json-schema.org/draft/2020-12/schema
name: ssid_confusion_test
attacker_module: ssid_confusion
actors:
  ap:
    source: internal
    selection:
      permanent_mac: "24:ec:99:bf:b0:a1"
      condition: [ AP, 2_4GHz, netns_change]
    setup:
      program: hostapd
      program_config:
        other_options: "-d"
        version: 2_10
        driver: nl80211
        ssid: SafeNet
        hw_mode: g
        auth_algs: 1
        wpa: 2
        ieee80211n: 1
        ieee80211w: 2
        wpa_key_mgmt: SAE
        rsn_pairwise: CCMP
        wpa_passphrase: password123
        sae_password: password123
        channel: 6
    ip_addr: "172.16.100.1"
   #FIXME proč to nefunguje?  netns: ap
  client:
    source: internal
    selection:
      condition: [ managed, 2_4GHz, netns_change ]
    setup:
      program: wpa_supplicant
      program_config:
        #other_options: "-d"
        version: 2_11
        ssid: SafeNet
        sae_password: password123
        ieee80211w: 2
        proto: RSN
        key_mgmt: SAE
        pairwise: CCMP
        group: CCMP
    netns: sta
    ip_addr: "172.16.100.2"
  rogue_client:
    source: internal
    selection:
      permanent_mac: "00:c0:ca:b7:69:2a"
      driver: mt76x2u
      condition: [ monitor , 2_4GHz, netns_change ]
      channel: 6
    #sniff_iface: true
    netns: rogue_sta
  rogue_ap:
    source: internal
    selection:
      driver: mt76x2u
      condition: [ monitor, 2_4GHz, netns_change ]
      channel: 1
    netns: rogue_ap
    #sniff_iface: true
attack_config:
  # SSID the rogue AP will advertise — should match a network the client auto-connects to
  confused_ssid: "FreeWiFi"
  # Strip RSN IE from the rogue beacon so the network appears open (no WPA3)
  strip_rsn: true
  attack_time_sec: 60
observers:
  client_dmesg:
    program: dmesg
    #program_config:
    #  level: "err,warn"

  # TODO -> not possible in AP mode or add sniff iface?
  #rogue_tshark:
  #  actor: rogue_ap
  #  program: tshark
  #  program_config:
  #    filter: "special_filter:actors"
  #    #filter: "type mgt subtype beacon or type mgt subtype auth or type mgt subtype assoc-req"
  rogue_sta_tshark:
    actor: rogue_client
    program: tshark
    program_config:
      filter: "special_filter:actors"
rewrite: errors