name: ssid_confusion_test
attacker_module: ssid_confusion
$extends: [./mc_mitm_internal.yaml]
actors:
  ap:
    setup:
      program_config:
        version: 2_10
        $DELETE: other_options
        ssid: SafeNet
  wrong_ap: # add riid condition
    source: internal
    selection:
      permanent_mac: "24:ec:99:bf:c7:cf"
      driver: ath9k_htc
      channel: 11
      condition: [ AP, 2_4GHz, netns_change ]
    setup:
      program: hostapd
      program_config:
        #other_options: -d
        version: 2_11
        driver: nl80211
        ssid: WrongNet
        hw_mode: g
        auth_algs: 1
        wpa: 2
        ieee80211n: 1
        ieee80211w: 2
        wpa_key_mgmt: SAE
        rsn_pairwise: CCMP
        wpa_passphrase: password123
        sae_password: password123
        channel: 11
    netns: wrong_ap
  client:
    setup:
      $DELETE: program_config
      program_config:
        wpa_supplicant_path: "./config/SafeNet_WrongNet.conf"
attack_config:
  # SSID the rogue AP will advertise - should match a network the client auto-connects to
  confused_ssid: "WrongNet"
  attack_time_sec: 60
