name: ssid_confusion_test_ext
attacker_module: ssid_confusion

actors:
  # Legitimate WrongNet AP (EAP-PWD on D-Link/OpenWrt); client has it at lower priority than SafeNet
  ap:
    source: external
    selection:
      channel: 11
      whitebox_host: OpenWrt
      condition: [ AP, 2_4GHz ]
    setup:
      program: openwrt
      program_config:
        ssid: WrongNet
        channel: 11
        mode: ap
        htmode: HT20
        wpa: "2"
        wpa_key_mgmt: WPA-EAP
        ieee8021x: "1"
        eap_server: "1"
        pwd_group: "19"
        encryption: ccmp
        eap_user_file: "hostapd.eap_user"
        log_level: 1
      ex_WB_programs: [ tcpdump ]
    ip_addr: "172.16.100.1"

  client:
    source: internal
    selection:
      condition: [ managed, 2_4GHz, netns_change ]
      channel: 11
    setup:
      program: wpa_supplicant
      program_config:
        other_options: "-d"
        # SafeNet has higher priority → client prefers SafeNet over WrongNet
        wpa_supplicant_path: "./config/SafeNet_WrongNet.conf"
    netns: sta
    ip_addr: "172.16.100.2"

  # Monitor on ch 1 (rogue channel): injects confused SafeNet beacons + relays client↔rogue_client
  rogue_ap:
    source: internal
    selection:
      permanent_mac: "90:de:80:6c:90:92"
      driver: [ mt76x2u, mt76x2u_git ]
      condition: [ monitor, 2_4GHz ]
      channel: 1

  # Monitor on ch 11 (WrongNet channel): CSA injection + relays to/from WrongNet AP
  rogue_client:
    source: internal
    selection:
      permanent_mac: "90:de:80:de:ff:7b"
      driver: [ mt76x2u, mt76x2u_git ]
      condition: [ monitor, 2_4GHz ]
      channel: 11

observers:
  tester_dmesg:
    program: dmesg
    program_config:
      level: "emerg,alert,crit,err,warn,notice,info,debug"

  rogue_ap_cap:
    actor: rogue_ap
    program: tshark
    program_config:
      filter: "special_filter:actors"

  rogue_client_cap:
    actor: rogue_client
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config:
  confused_ssid: SafeNet  # SSID the confused beacon advertises on rogue channel
  attack_time_sec: 150
  beacon_interval_ms: 100
  beacon_warning_sec: 2
  only_to_mitm: false     # keep running after GotMitm to collect traffic evidence

rewrite: errors
