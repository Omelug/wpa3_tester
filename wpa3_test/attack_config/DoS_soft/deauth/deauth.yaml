name: deauth_wpa2
attacker_module: deauth
$validator: ./deauth.schema.yaml
$extends: [
  ../../comp/ap/ap_2_11_WPA2_only_MFPd_6.comp.yaml,
  ../../comp/client/client_2_9_WPA2_MFPd_6.comp.yaml
]
actors:
  ap:
    setup:
      program_config:
        other_options: "-d"
  attacker:
    source: internal
    selection:
      driver: [ mt76x2u, mt76x2u_git ]
      condition: [ monitor, 2_4GHz ]
      channel: 6
observers:
  client_tshark:
    actor: client
    program: tshark
    program_config:
      filter: "special_filter:actors"
  ap_tshark:
    actor: ap
    program: tshark
    program_config:
      filter: "special_filter:actors"
attack_config:
  attack_time: 30
  ms_interval: 100
  sleep_before_sec: 10
  sleep_after_sec: 10
rewrite: errors
