name: memory_omnivore_Dlink_ACK
attacker_module: memory_omnivore
$validator: memory_omniverse.schema.yaml
actors:
  ap:
    $extends: ../../comp/Dlink/Dlink_wb.comp.yaml
  client:
    source: internal
    selection:
      condition: [ 2_4GHz, netns_change ]
      driver: [ mt76x2u, mt76x2u_git ]
    setup:
      program: wpa_supplicant
      program_config:
        ssid: test_wpa3_tester_Dlink
        sae_password: password123
        ieee80211w: 2
        proto: RSN
        key_mgmt: SAE
        pairwise: CCMP
        group: CCMP
    netns: sta
    ip_addr: "172.16.100.2"
    sniff_iface: true
  attacker:
    source: internal
    selection:
      driver: ath9k_htc
      condition: [ monitor, injection_selftest, 2_4GHz ]
      channel: 6
    sniff_iface: true
observers:
  tshark_client:
    actor: client
    program: tshark
    program_config:
      filter: ""
  tshark_attacker:
    actor: attacker
    program: tshark
    program_config:
      filter: ""
  ap_resources:
    actor: ap
    program: resource_checker
    program_config:
      interval: 1
attack_config:
  attack_time_sec: 30
  burst_size: 128
  acm_threshold: 5 # defualt openwrt value
  random_dh_groups: true
  use_connected_stas: true