name: amsdu_test_internal
attacker_module: amsdu

requirements:
  rssi_setup:
    band: "2_4GHz"
    conditions: [
      "(ap <-> rogue_client) > -90",
      "(client <-> rogue_ap) > -90",
      "(client <-> rogue_client) >= 1m",
      "(ap <-> rogue_ap) >= 1m",
      "(client <-> ap) < (client <-> rogue_ap)",
      "(client <-> ap) < (ap <-> rogue_client)"
    ]

actors:
  ap:
    source: internal
    selection:
      channel: 11
      permanent_mac: "90:de:80:4e:31:e6"
      condition: [ AP, 2_4GHz, netns_change ]
    setup:
      program: hostapd
      program_config:
        other_options: -d
        version: 2_11
        driver: nl80211
        ssid: test_amsdu
        hw_mode: g
        auth_algs: 1
        wpa: 2
        ieee80211n: 1
        ieee80211w: 2
        wpa_key_mgmt: SAE
        rsn_pairwise: CCMP
        wpa_passphrase: password123
        sae_password: password123
        channel: 11
    ip_addr: "172.16.100.1"
    netns: ap

  client:
    source: internal
    selection:
      condition: [ managed, 2_4GHz, netns_change ]
      channel: 11
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_11
        other_options: -d
        ctrl_interface: /var/run/wpa_supplicant
        group: CCMP
        ieee80211w: 2
        key_mgmt: SAE
        pairwise: CCMP
        proto: RSN
        sae_password: password123
        ssid: test_amsdu
    netns: sta
    ip_addr: "172.16.100.2"

  rogue_client:
    source: internal
    selection:
      permanent_mac: "90:de:80:6c:90:92"
      driver: [ mt76x2u, mt76x2u_git ]
      condition: [ monitor, 2_4GHz, netns_change ]
      channel: 11
    netns: rogue

  rogue_ap:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz, netns_change ]
      permanent_mac: "90:de:80:de:fd:b2"
      driver: [ mt76x2u, mt76x2u_git ]
      channel: 1
    netns: rogue

observers:
  sta_ap_iperf3:
    actor: client
    program: iperf3
    program_config:
      target_actor: ap
  watch_client:
    actor: client
    program: wpa_cli
    program_config:
      interval: 2
  tester_dmesg:
    program: dmesg
    program_config:
      level: "emerg,alert,crit,err,warn,notice,info,debug"
  rogue_ap_cap:
    actor: rogue_ap
    program: tshark
    program_config:
      filter: "special_filter:actors"
  rogue_client_cap:
    actor: rogue_client
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config:
  attack_time: 60
  only_to_mitm: false
  prefer_active: false
  ssid: test_amsdu
  beacon_interval_ms: 100
  beacon_warning_sec: 2
  beacon_timeout_sec: 10

  # CVE-2020-26144: plaintext EAPOL A-MSDU -> ICMPv6 RA broadcast (no external server needed)
  inject_eapol_amsdu: true
  # attacker_dns_v6: IPv6 address the client will use as DNS server after RDNSS poisoning.
  # Use AP's IP as IPv4-mapped IPv6 (::ffff:<ap.ip_addr>) so traffic flows through AP's netns
  # where the DNS listener runs. tshark in stats captures DNS on UDP 53 inside netns:ap.
  attacker_dns_v6: "::ffff:172.16.100.1"

  # CVE-2020-24588: defaults to client ip_addr; override here to use a different target
  # watch_inner_size is auto-computed when victim_ip is set; override manually if needed
  victim_ip: ""
  trigger_count: 3
  watch_inner_size: 0   # 0 = auto-compute

rewrite: errors
