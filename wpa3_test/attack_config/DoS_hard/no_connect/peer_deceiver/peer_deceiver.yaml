name: peer_deceiver
# WPA3 connection deprivation - Lounis & Zulkernine [19] (cited in Chatzoglou 2022, Section 7)
# Attacker sniffs STA SAE Commit frames and injects spoofed AP rejection (STATUS_UNSUPPORTED_GROUP)
# before the real AP responds - STA drops the handshake. No passphrase needed.
attacker_module: peer_deceiver
actors:
  ap:
    $extends: ../../../comp/Dlink/Dlink_wb.comp.yaml
  client:
    $extends: ../../../comp/Dlink/mixed_client_2_4.comp.yaml
    setup:
      program_config:
        ssid: test_wpa3_tester_Dlink
  attacker:
    source: internal
    selection:
      driver: ath9k_htc
      condition: [ monitor, 2_4GHz ]
      channel: 6
    sniff_iface: true
observers:
  ap_resources:
    actor: ap
    program: resource_checker
    program_config:
      interval: 1
attack_config:
  attack_time_sec: 60
  burst_size: 3
  flood_interval_ms: 20
  sleep_before_sec: 2
  sleep_after_sec: 2
rewrite: errors
delete_old: true