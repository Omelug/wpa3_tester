name: ssid_confusion_test
attacker_module: ssid_confusion
#requirements:
#  rssi_setup:
#    band: "2_4GHz"
#    conditions: [
#      "(ap <-> rogue_client) > -90",
#      "(client <-> rogue_ap) > -90",
#      "(client <-> ap) < (client <-> rogue_ap)",
#      "(client <-> ap) < (ap <-> rogue_client)"
#    ]
actors:
  # Legitimate WrongNet AP (EAP-PWD, internal hostapd); client has it at lower priority than SafeNet
  ap:
    source: internal
    selection:
      permanent_mac: "90:de:80:4e:31:e6"
      #permanent_mac: "24:ec:99:bf:b0:a1"
      channel: 11
      condition: [ AP, 2_4GHz, netns_change ]
    setup:
      program: hostapd
      program_config:
        other_options: -d
        version: 2_11
        driver: nl80211
        ssid: WrongNet
        hw_mode: g
        channel: 11
        auth_algs: 1
        ieee80211n: 1
        wpa: 2
        wpa_key_mgmt: WPA-EAP
        rsn_pairwise: CCMP
        ieee8021x: 1
        eap_server: 1
        eap_user_file: hostapd.eap_user
        pwd_group: 19
        own_ip_addr: "127.0.0.1"
        #TODO do configu
        okc: 0
        disable_pmksa_caching: 1
    ip_addr: "172.16.100.1"
    netns: ap

  client:
    source: internal
    selection:
      #permanent_mac: "24:ec:99:bf:c7:cf"
      #permanent_mac: "90:de:80:de:ff:7b"
      #driver: ath9k_htc
      condition: [ managed, 2_4GHz, netns_change ]
      channel: 11
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_11
        other_options: "-d"
        # SafeNet has higher priority -> client prefers SafeNet over WrongNet
        wpa_supplicant_path: "./config/SafeNet_WrongNet.conf"
        ##TODO do configu
        #okc: 0
        #disable_pmksa_caching: 1
    netns: sta
    ip_addr: "172.16.100.2"

  # Monitor on ch 11: CSA injection + relays to/from WrongNet AP
  rogue_client:
    source: internal
    selection:
      permanent_mac: "90:de:80:6c:90:92"
      driver: [ mt76x2u, mt76x2u_git ]
      condition: [ monitor, 2_4GHz ]
      channel: 11

  # Monitor on ch 1 (rogue channel): injects confused SafeNet beacons + relays client↔rogue_client
  rogue_ap:
    source: internal
    selection:
      permanent_mac: "90:de:80:de:fd:b2"
      driver: [ mt76x2u, mt76x2u_git ]
      condition: [ monitor, 2_4GHz ]
      channel: 1

observers:
  watch_client:
    actor: client
    program: wpa_cli
    program_config:
      interval: 2
  tester_dmesg:
    program: dmesg
    program_config:
      level: "emerg,alert,crit,err,warn,notice,info,debug"
  tracer:
    program: trace_cmd
    actor: ap
    program_config:
      events:
        - "ath"
        - "mac80211"
        - "mt76"
        - "mac80211:api_start_tx_ba_session"
        - "mac80211:api_start_tx_ba_cb"
        - "mac80211:api_stop_tx_ba_session"
        - "mac80211:api_stop_tx_ba_cb"
        - "mt76:mac_txdone"

  rogue_ap_cap:
    actor: rogue_ap
    program: tshark
    program_config:
      filter: "special_filter:actors"

  rogue_client_cap:
    actor: rogue_client
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config:
  confused_ssid: SafeNet
  attack_time_sec: 150
  beacon_interval_ms: 100
  beacon_warning_sec: 2
  only_to_mitm: false

rewrite: errors
