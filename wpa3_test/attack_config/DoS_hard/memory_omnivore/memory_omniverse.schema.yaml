title: Cookie guzzler Config
type: object
$extends: ../dos_time.comp.schema.yaml
properties:
  attack_config:
    type: object
    required:
      $UNION: [burst_size, acm_threshold, random_dh_groups, use_connected_stas]
    properties:
      burst_size:
        type: integer
        minimum: 1
      acm_threshold:
        type: integer
        minimum: 0
      random_dh_groups:
        type: boolean
      use_connected_stas:
        type: boolean
    additionalProperties: false
