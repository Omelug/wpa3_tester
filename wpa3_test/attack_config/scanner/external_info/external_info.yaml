name: external_info
$validator: "./external_info.schema.yaml"
attacker_module: external_info

actors:
  scanner:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz ]
      channel: 6
    #sniff_iface: true
    # FIXME rtl8xxxu dont work (change to channel 6, monitor works, but dont print anything)

observers:
  tshark_scanner:
    actor: scanner
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config:
  timeout_sec: 30
  # actor_limit: 10   # stop after discovering this many APs (0 or omit = unlimited)

rewrite: all