name: CSA_ex
attacker_module: channel_switch
$validator: ../channel_switch.schema.yaml
scan_iface: wlan1
scan_channels: [ 6 ]
scan_until_match: true
#RTL8188EUS broken -> scanner conditions?
#TODO requirement connected AP-STA external
requirements:
  ex_BB_connection: [ [ ap, client ] ]
#FIXM only in ath_htc, není to tím, že musí už předtím v monitor módu?
#označit n2jak wizard , nebo wizard -> error v run config
actors:
  ap:
    source: external
    selection:
      ssid: test_wpa3_tester
      channel: 6
      condition: [ AP, 2_4GHz ]
  client:
    source: external
    selection:
      permanent_mac: "00:03:7f:c2:00:43"
      condition: [ STA, 2_4GHz ]
      channel: 6
  attacker:
    source: internal
    selection:
      #driver: mt76x2u
      condition: [ monitor, 2_4GHz ]
      channel: 6
  rogue_ap:
    sniff_iface: true
    setup:
      program_config:
        ssid: test_wpa3_tester
$extends: [ ./ex_observers.comp.yaml, ../../../comp/rogue_ap/rogue_ap_1.comp.yaml ]

attack_config:
  attack_time: 60
  ms_interval: 100
  new_channel: 1
  sleep_before_sec: 10
  sleep_after_sec: 10

rewrite: errors
