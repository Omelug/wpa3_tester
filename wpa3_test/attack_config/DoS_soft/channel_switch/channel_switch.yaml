$schema: https://json-schema.org/draft/2020-12/schema
name: channel_switch_test
attacker_module: channel_switch
$validator: ./channel_switch.schema.yaml
$extends: [
  ../../comp/ap/ap_2_11_WPA3_only_MFPr_6.comp.yaml,
  ../../comp/client/client_2_10_WPA3_mixed_MFPo_6.comp.yaml,
  ./observers.comp.yaml
]
actors:
  ap:
    setup:
      program_config:
        other_options: "-d"
  client:
    source: internal
    setup:
      program_config:
        version: "2.9"
  attacker:
    source: internal
    selection:
      driver: mt76x2u
      condition: [ monitor, 2_4GHz ]
      channel: 6

attack_config:
  attack_time: 30
  ms_interval: 100
  new_channel: 1
  sleep_before_sec: 10
  sleep_after_sec: 10
rewrite: errors