source: external
selection:
  whitebox_host: OpenWrt
  condition: [ AP, 80211ac, 5GHz ]
setup:
  program: openwrt
  program_config:
    #different name for 5Ghz
    ssid: test_wpa3_tester_Dlink_5GHz
    channel: 36
    key: password123
    proto: RSN
    encryption: sae-mixed
    mode: ap
    htmode: VHT20
  ex_WB_programs: [ tcpdump ]
ip_addr: "172.16.100.1"
