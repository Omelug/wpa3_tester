title: Cookie guzzler Config
type: object
$extends: ../dos_time.comp.schema.yaml
properties:
  attack_config:
    type: object
    required:
      $UNION: [acm_trigger_count]
    additionalProperties: false
    properties:
      attack_time_sec:
        description: time of sending cookie guzzler packets
      acm_trigger_count:
        type: integer
        minimum: 0
      acm_pause_millisec:
        type: integer
        minimum: 0
        default: 10
      burst_size:
        type: integer
        minimum: 1
      cookie_wait_ms:
        type: integer
        minimum: 0
      frames_per_second_limit:
        type: integer
        minimum: 1

