name: Clang-Tidy

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

jobs:
  clang-tidy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy-18 python3-yaml

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S . -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Run clang-tidy
        run: |
          CHECKS=$(python3 -c "
          import yaml, sys
          for doc in yaml.safe_load_all(open('.clangd')):
              ct = (doc or {}).get('Diagnostics', {}).get('ClangTidy', {})
              if 'Checks' in ct:
                  print(','.join(ct['Checks']))
                  sys.exit(0)
          ")

          # Only C/C++ source files tracked by git
          mapfile -t FILES < <(git ls-files -- '*.cpp' '*.cc' '*.cxx' '*.c')

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No tracked C/C++ files found, nothing to check."
            exit 0
          fi

          FILTER=$(printf '%s\n' "${FILES[@]}" | python3 -c "
          import re, sys
          print('|'.join(re.escape(line.strip()) for line in sys.stdin if line.strip()))
          ")

          REPO_ROOT=$(git rev-parse --show-toplevel)
          run-clang-tidy-18 -p build -checks="$CHECKS" -header-filter="$REPO_ROOT/(wpa3_test|result_overview|tests|tests_manual)/" "$FILTER"