$schema: https://json-schema.org/draft/2020-12/schema
name: wpa3_transition_downgrade_wpa3_disable
attacker_module: wpa3_trans_downgrade
$extends: [ ./downgrade_vuln.yaml ]
actors:
  ap:
    setup:
        program_config:
          #wpa_passphrase: password123
          transition_disable: "0x01"
  client:
    source: internal
    selection:
      condition: [ managed, 2_4GHz, netns_change ]
    #selection:
    #  driver: rtl8xxxu
    setup:
      program: wpa_supplicant
      program_config:
        ieee80211w: 2 #Needed for WPA3 disable
        key_mgmt: SAE WPA-PSK