name: amsdu_external_client
attacker_module: amsdu

requirements:
  rssi_setup:
    band: "2_4GHz"
    conditions: [
      "(ap <-> rogue_client) > -90",
      "(client <-> rogue_ap) > -90",
      "(client <-> rogue_client) >= 1m",
      "(ap <-> rogue_ap) >= 1m",
      "(client <-> ap) < (client <-> rogue_ap)",
      "(client <-> ap) < (ap <-> rogue_client)"
    ]

actors:
  ap:
    source: internal
    selection:
      channel: 11
      permanent_mac: "90:de:80:4e:31:e6"
      condition: [ AP, 2_4GHz, netns_change ]
    setup:
      program: hostapd
      program_config:
        other_options: -d
        version: 2_11
        driver: nl80211
        ssid: test_amsdu
        hw_mode: g
        auth_algs: 1
        wpa: 2
        ieee80211n: 1
        ieee80211w: 2
        wpa_key_mgmt: SAE
        rsn_pairwise: CCMP
        wpa_passphrase: password123
        sae_password: password123
        channel: 11
    ip_addr: "172.16.100.1"
    netns: ap

  client:
    source: external
    scan_ignore: yes
    selection:
      condition: [ STA, 2_4GHz ]
      channel: 11

  rogue_client:
    source: internal
    selection:
      permanent_mac: "90:de:80:6c:90:92"
      driver: [ mt76x2u, mt76x2u_git ]
      condition: [ monitor, 2_4GHz, netns_change ]
      channel: 11
    netns: rogue

  rogue_ap:
    source: internal
    selection:
      condition: [ monitor, 2_4GHz, netns_change ]
      permanent_mac: "90:de:80:de:fd:b2"
      driver: [ mt76x2u, mt76x2u_git ]
      channel: 1
    netns: rogue

observers:
  tester_dmesg:
    program: dmesg
    program_config:
      level: "emerg,alert,crit,err,warn,notice,info,debug"
  rogue_ap_cap:
    actor: rogue_ap
    program: tshark
    program_config:
      filter: "special_filter:actors"
  rogue_client_cap:
    actor: rogue_client
    program: tshark
    program_config:
      filter: "special_filter:actors"

attack_config:
  attack_time: 60
  only_to_mitm: false
  prefer_active: false
  ssid: test_amsdu
  beacon_interval_ms: 100
  beacon_warning_sec: 2
  beacon_timeout_sec: 10
  inject_eapol_amsdu: true
  attacker_dns_v6: "::ffff:172.16.100.1"
  victim_ip: ""
  trigger_count: 3
  watch_inner_size: 0

rewrite: errors
