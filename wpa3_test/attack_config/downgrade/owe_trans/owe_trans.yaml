name: owe_transition_probe_leak
attacker_module: owe_trans
actors:
  ap:
    source: internal
    selection:
      condition: [ AP ]
      permanent_mac: "90:de:80:de:fd:b2"
    setup:
      program: hostapd
      program_config:
        version: 2_11
        driver: nl80211
        hw_mode: g
        channel: 6
        ieee80211n: 1
        owe_transition_mode: true
        open_ssid: test_open
        owe_ssid: test_owe
        wpa: 2
        wpa_key_mgmt: OWE
        rsn_pairwise: CCMP
        ieee80211w: 2
    ip_addr: "172.16.100.1"
  client:
    source: internal
    selection:
      condition: [ managed, 2_4GHz, netns_change, OWE ]
    setup:
      program: wpa_supplicant
      program_config:
        version: 2_11
        #other_options: "-d"
        ssid: test_owe
        ieee80211w: 2
        proto: RSN
        key_mgmt: OWE
        pairwise: CCMP
        group: CCMP
    netns: sta
    ip_addr: "172.16.100.2"
  attacker:
    source: internal
    selection:
      permanent_mac: "90:de:80:6c:90:92"
      condition: [ monitor, 2_4GHz ]
      channel: 6
observers:
  attacker_tshark:
    actor: attacker
    program: tshark
    program_config:
      filter: "special_filter:actors"
  client_tshark:
    actor: client
    program: tshark
    program_config:
      filter: "special_filter:actors"
attack_config:
  # seconds to wait after AP is stopped before checking for probe requests
  probe_wait_time: 30
rewrite: errors
