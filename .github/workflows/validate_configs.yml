name: Validate attack configs

on:
  pull_request:
    paths:
      - 'wpa3_test/attack_config/**'
      - 'wpa3_test/src/setup/**'
      - 'tests/setup/**'
  workflow_run:
    workflows: [ Tests ]
    types: [ completed ]
    branches: [ main ]
    paths:
      - 'wpa3_test/attack_config/**'
      - 'wpa3_test/src/setup/**'
      - 'tests/setup/**'
jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup-deps

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S . -B build -G Ninja

      - name: Build validation tests
        run: cmake --build build --target run_validation_tests -j$(nproc)

      - name: Run config validation
        run: ctest --test-dir build -R ValidationTests --output-on-failure
