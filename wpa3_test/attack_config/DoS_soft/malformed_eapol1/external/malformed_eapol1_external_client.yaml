$schema: https://json-schema.org/draft/2020-12/schema
name: malformed_eapol1_Dlink_client
attacker_module: malformed_eapol1
actors:
  ap:
    $extends: ../../../comp/Dlink/Dlink_bb.comp.yaml
  client:
    source: external
    selection:
      channel: 6
  attacker:
    source: internal
    selection:
      driver: mt76x2u
      condition: [ monitor, 2_4GHz ]
      channel: 6
observers:
  client_tshark:
    actor: client
    program: tshark
    program_config:
      filter: "udp port 5201"
  ap_tshark:
    actor: ap
    program: tshark
    program_config:
      filter: "udp port 5201"