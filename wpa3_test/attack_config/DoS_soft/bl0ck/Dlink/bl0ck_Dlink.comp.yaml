attacker_module: bl0ck
scan_iface: wlan1
actors:
  ap:
    $extends: ../../../comp/Dlink/Dlink_wb_5Ghz.comp.yaml
  client:
    source: internal
    setup:
      program: wpa_supplicant
      program_config:
        freq_list: 5180
        group: CCMP
        ieee80211w: 2
        key_mgmt: SAE
        pairwise: CCMP
        sae_password: password123
        scan_freq: 5180
        ssid: test_wpa3_tester_5GHz
        version: 2_10
    ip_addr: "172.16.100.2"
    selection:
      channel: 36
      #permanent_mac: "00:c0:ca:b7:69:2a"
      condition: [ monitor, 80211ac, 5GHz, netns_change ]
    netns: sta
    sniff_iface: true
  attacker:
    source: internal
    selection:
      channel: 36
      #driver: rtw_8821cu #TODO rtw_8821au nefunguje, proč?
      condition: [
        monitor,
        5GHz ]
observers:
  #mausezahn:
  #  actor: client
  #  program: mausezahn
  #  program_config:
  #    target_actor: ap
  ap_mausezahn:
    actor: client
    program: iperf3
    program_config:
      target_actor: ap
  att_tshark:
    actor: attacker
    program: tshark
    program_config:
      filter: "special_filter:actors"
  client_tshark:
    actor: client
    program: tshark
    program_config:
      filter: "special_filter:actors"

  ap_tcpdump:
    actor: ap
    program: tcpdump
    program_config:
      filter: "udp port 5201"