      program_config:
        version: 2_11
        ssid: test_wpa3_tester_Dlink
    #selection:
    #  driver: [ mt76x2u, mt76x2u_git ]
    sniff_iface: true

  attacker:
    source: internal
    selection:
      driver: ath9k_htc
      condition: [ monitor, 2_4GHz ] #injection_selftest #TODO add condition for injection?
      channel: 6
    sniff_iface: true
